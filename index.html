<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王俊权牛逼</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a0a14;
            position: relative;
        }

        /* 背景图片 */
        .background-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('m1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: -2;
            filter: brightness(0.7) contrast(1.1);
        }

        /* 雪花容器 */
        .snow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .snowflake {
            position: absolute;
            top: -10px;
            color: #ffffff;
            font-size: 1em;
            opacity: 0.8;
            animation: fall linear infinite;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
        }

        @keyframes fall {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* 主容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        /* 毛玻璃效果 */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            padding: 40px;
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        /* 多彩字体效果 */
        .colorful-text {
            background: linear-gradient(90deg, 
                #FF6B8B, #FF8E53, #FFD166, 
                #06D6A0, #118AB2, #7209B7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 300% 300%;
            animation: gradient-shift 8s ease infinite;
        }

        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 标题样式 */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 作者介绍部分 */
        .intro-section {
            margin-bottom: 50px;
        }

        .intro-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
        }

        .intro-title i {
            margin-right: 15px;
            font-size: 2rem;
        }

        .intro-content {
            font-size: 1.2rem;
            line-height: 1.8;
            text-align: justify;
        }

        .highlight {
            font-weight: 600;
            color: #FFD166;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.3);
        }

        /* 关于作者按钮 */
        .about-button {
            display: block;
            width: 200px;
            margin: 30px auto 50px;
            padding: 18px 30px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }

        .about-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        /* 社交图标区域 */
        .social-section {
            display: none;
            margin-top: 30px;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .social-icons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 40px;
            margin-top: 30px;
        }

        .social-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: transform 0.3s ease;
        }

        .social-item:hover {
            transform: translateY(-10px) scale(1.05);
        }

        .social-icon {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .social-icon img {
            width: 60%;
            height: 60%;
            object-fit: contain;
            border-radius: 10px;
        }

        .social-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .social-id {
            font-size: 0.9rem;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* 原神区域 */
        .genshin-section {
            text-align: center;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .genshin-title {
            font-size: 1.8rem;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .genshin-icon {
            width: 120px;
            height: 120px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .genshin-icon:hover {
            transform: translateY(-10px) scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .genshin-icon img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 15px;
        }

        .genshin-text {
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* 页脚 */
        .footer {
            text-align: center;
            padding: 40px 0;
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 40px;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2.5rem;
            }
            
            .glass-card {
                padding: 25px;
            }
            
            .intro-title {
                font-size: 1.8rem;
            }
            
            .intro-content {
                font-size: 1.1rem;
            }
            
            .social-icons {
                gap: 25px;
            }
            
            .social-icon {
                width: 80px;
                height: 80px;
            }
        }

        /* 音乐播放器隐藏 */
        #background-music {
            display: none;
        }
    </style>
</head>
<body>
    <!-- 背景图片 -->
    <div class="background-image"></div>
    
    <!-- 雪花效果容器 -->
    <div class="snow-container" id="snow-container"></div>
    
    <!-- 背景音乐（自动播放，无法控制） -->
    <audio id="background-music" autoplay loop>
        <source src="cxx.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>
    
    <!-- 主内容 -->
    <div class="container">
        <!-- 标题 -->
        <header class="header glass-card">
            <h1 class="colorful-text">个人简介</h1>
            <p>王俊权牛逼🤯🤯🤯🤯</p>
        </header>
        
        <!-- 作者介绍 -->
        <section class="intro-section glass-card">
            <h2 class="intro-title colorful-text">
                <i class="fas fa-user-circle"></i>关于我
            </h2>
            <div class="intro-content">
                <p>是<span class="highlight">iQOO手机的忠实爱好者</span>🤓🤓🤓🤓<span class="highlight">原神</span>王俊权牛逼666</p>
                <br>
                <p>王俊权牛逼<span class="highlight">王俊权牛逼</span>王俊权牛逼</p>
                <br>
                <p>王俊权牛逼<span class="highlight">王俊权牛逼</span>。</p>
            </div>
        </section>
        
        <!-- 关于作者按钮 -->
        <button class="about-button glass-card" id="about-button">
            <i class="fas fa-chevron-down"></i> 关于作者/联系方式
        </button>
        
        <!-- 社交图标区域（默认隐藏） -->
        <section class="social-section glass-card" id="social-section">
            <h2 class="intro-title colorful-text">
                <i class="fas fa-share-alt"></i>联系与社交
            </h2>
            <p style="text-align: center; margin-bottom: 20px; opacity: 0.9;">点击图标可直接跳转到对应应用</p>
            
            <div class="social-icons">
                <!-- 快手 -->
                <a href="kwai://profile/X1---------1X" class="social-item" target="_blank" onclick="openKwai(event)">
                    <div class="social-icon">
                        <img src="cxx5.png" alt="快手">
                    </div>
                    <div class="social-name">快手</div>
                    <div class="social-id">X1---------1X</div>
                </a>
                
                <!-- 纸飞机 -->
                <a href="tg://resolve?domain=SaoZhu875" class="social-item" target="_blank" onclick="openTelegram(event)">
                    <div class="social-icon">
                        <img src="cxx9.png" alt="纸飞机">
                    </div>
                    <div class="social-name">纸飞机</div>
                    <div class="social-id">@SaoZhu875</div>
                </a>
                
                <!-- QQ -->
                <a href="mqq://im/chat?chat_type=wpa&uin=3393243175&version=1&src_type=web" class="social-item" target="_blank" onclick="openQQ(event)">
                    <div class="social-icon">
                        <img src="cxx2.png" alt="QQ">
                    </div>
                    <div class="social-name">QQ</div>
                    <div class="social-id">3393243175</div>
                </a>
            </div>
        </section>
        
        <!-- 原神区域 -->
        <section class="genshin-section glass-card">
            <h2 class="genshin-title colorful-text">
                <i class="fas fa-gamepad"></i> 原神 · 日常消遣
            </h2>
            <p style="margin-bottom: 25px; font-size: 1.1rem; opacity: 0.9;">点击图标可打开原神游戏或访问官网</p>
            
            <div class="genshin-icon" id="genshin-icon">
                <img src="m4.png" alt="原神">
            </div>
            
            <p class="genshin-text">《原神》是我日常游戏的主打，喜欢在提瓦特大陆探索、解谜、战斗，享受开放世界带来的自由与惊喜😋😋😋</p>
        </section>
        
        <!-- 页脚 -->
        <footer class="footer">
            <p>无人扶我凌云志，我自己也上不去🥵🥵</p>
            <p style="margin-top: 10px;">🤤🤤🤤</p>
        </footer>
    </div>

    <script>
        // 创建雪花效果
        function createSnowflakes() {
            const snowContainer = document.getElementById('snow-container');
            const snowflakeCount = 80;
            
            for (let i = 0; i < snowflakeCount; i++) {
                const snowflake = document.createElement('div');
                snowflake.classList.add('snowflake');
                snowflake.innerHTML = '莫雯曦牛逼666';
                
                // 随机属性
                const size = Math.random() * 20 + 10;
                const left = Math.random() * 100;
                const duration = Math.random() * 20 + 10;
                const delay = Math.random() * 5;
                const opacity = Math.random() * 0.7 + 0.3;
                
                snowflake.style.fontSize = `${size}px`;
                snowflake.style.left = `${left}vw`;
                snowflake.style.animationDuration = `${duration}s`;
                snowflake.style.animationDelay = `${delay}s`;
                snowflake.style.opacity = opacity;
                
                snowContainer.appendChild(snowflake);
            }
        }

        // 关于作者按钮点击事件
        document.getElementById('about-button').addEventListener('click', function() {
            const socialSection = document.getElementById('social-section');
            
            if (socialSection.style.display === 'block') {
                socialSection.style.display = 'none';
                this.innerHTML = '<i class="fas fa-chevron-down"></i> 关于作者/联系方式';
            } else {
                socialSection.style.display = 'block';
                this.innerHTML = '<i class="fas fa-chevron-up"></i> 收起联系方式';
                
                // 添加滚动效果
                socialSection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        });

        // 社交应用打开处理
        function openKwai(e) {
            e.preventDefault();
            // 尝试打开快手应用
            window.location.href = 'kwai://profile/X1---------1X';
            // 如果无法打开应用，则跳转到网页版
            setTimeout(function() {
                window.location.href = 'https://www.kuaishou.com/profile/3xXXXXX';
            }, 500);
        }

        function openTelegram(e) {
            e.preventDefault();
            // 尝试打开Telegram应用
            window.location.href = 'tg://resolve?domain=SaoZhu875';
            // 如果无法打开应用，则跳转到网页版
            setTimeout(function() {
                window.location.href = 'https://t.me/SaoZhu875';
            }, 500);
        }

        function openQQ(e) {
            e.preventDefault();
            // 尝试打开QQ应用
            window.location.href = 'mqq://im/chat?chat_type=wpa&uin=3393243175&version=1&src_type=web';
            // 如果无法打开应用，则显示提示
            setTimeout(function() {
                alert('如果QQ没有自动打开，请手动添加好友：3393243175');
            }, 500);
        }

        // 原神图标点击事件
        document.getElementById('genshin-icon').addEventListener('click', function() {
            // 尝试打开原神应用
            window.location.href = 'yuanshen://';
            
            // 如果无法打开应用，则跳转到官网
            setTimeout(function() {
                window.location.href = 'https://ys.mihoyo.com/';
            }, 500);
        });

        // 背景音乐自动播放处理
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试播放背景音乐
            const audio = document.getElementById('background-music');
            audio.play().catch(function(error) {
                console.log('音频自动播放被阻止，需要用户交互:', error);
                // 添加一个页面点击事件来启动音频
                document.body.addEventListener('click', function initAudio() {
                    audio.play();
                    document.body.removeEventListener('click', initAudio);
                });
            });
            
            // 创建雪花效果
            createSnowflakes();
        });

        // 鼠标移动时的视差效果
        document.addEventListener('mousemove', function(e) {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            // 背景图片轻微移动
            const bg = document.querySelector('.background-image');
            bg.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            
            // 毛玻璃卡片轻微移动
            const cards = document.querySelectorAll('.glass-card');
            cards.forEach(card => {
                const speed = card.classList.contains('header') ? 0.5 : 0.3;
                card.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body>
</html>
