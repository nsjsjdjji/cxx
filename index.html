<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载动画 + 玻璃弹窗</title>
<style>
/* 全局重置 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 背景渐变模糊 */
body {
    background: linear-gradient(135deg, #3a7bd5, #00d2ff, #7b4397, #dc2430);
    background-size: 400% 400%;
    animation: bgGradient 12s ease infinite;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* 背景渐变动画 */
@keyframes bgGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 加载动画容器 */
.loader {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    opacity: 1;
    transition: opacity 1s ease;
}

/* 加载动画圆点 */
.loader .dot {
    width: 20px; height: 20px;
    margin: 0 10px;
    border-radius: 50%;
    background: #fff;
    animation: jump 1.5s infinite ease-in-out;
}

/* 圆点弹跳动画 */
@keyframes jump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
}
.loader .dot:nth-child(2) { animation-delay: 0.2s; }
.loader .dot:nth-child(3) { animation-delay: 0.4s; }

/* 主内容（开始按钮） */
.main-content {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: translateY(100px);
    transition: opacity 1.2s ease, transform 1.2s ease;
    pointer-events: none;
}

/* 玻璃弹窗 */
.glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 22px;
    padding: 35px 55px;
    text-align: center;
}

/* 渐变文字 */
.gradient-text {
    font-size: 32px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff9966, #ff5e62, #833ab4, #fd1d1d, #fcb045);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textGradient 4s ease infinite;
    cursor: pointer;
}

/* 点击文字稍微缩放效果 */
.gradient-text:active {
    transform: scale(0.95);
}

/* 渐变文字动画 */
@keyframes textGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 点击开始后 */
.started .main-content {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.started .loader {
    opacity: 0;
    pointer-events: none;
}

/* 丝滑跳转动画：body 淡出 */
body.fade-out {
    opacity: 0;
    transition: opacity 0.8s ease;
}
</style>
</head>
<body>

<!-- 加载动画 -->
<div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- 主页面内容：开始按钮 -->
<div class="main-content">
    <div class="glass-card">
        <div class="gradient-text" onclick="enterMain()">开始！</div>
    </div>
</div>

<script>
// 模拟加载完成
setTimeout(() => {
    document.body.classList.add('started');
}, 2200);

// 点击开始 → 丝滑跳转 home.html
function enterMain() {
    // 1. 先执行淡出动画
    document.body.classList.add('fade-out');

    // 2. 等待动画完成后跳转
    setTimeout(() => {
        window.location.href = "home.html";
    }, 800); // 时间匹配 CSS 动画时长
}
</script>

</body>
</html>
