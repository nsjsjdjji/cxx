<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载动画 + 玻璃弹窗</title>
<style>
/* 全局重置 */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* 背景渐变模糊 */
body {
    background: linear-gradient(135deg, #3a7bd5, #00d2ff, #7b4397, #dc2430);
    background-size: 400% 400%;
    animation: bgGradient 12s ease infinite;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    transition: opacity 0.8s ease; /* 统一过渡动画 */
}

/* 背景渐变动画 */
@keyframes bgGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 加载动画容器 */
.loader {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    opacity: 1;
    transition: opacity 1s ease;
}

/* 加载动画圆点 */
.loader .dot {
    width: 20px; height: 20px;
    margin: 0 10px;
    border-radius: 50%;
    background: #fff;
    animation: jump 1.5s infinite ease-in-out;
}

/* 圆点弹跳动画 */
@keyframes jump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
}
.loader .dot:nth-child(2) { animation-delay: 0.2s; }
.loader .dot:nth-child(3) { animation-delay: 0.4s; }

/* 主页面内容容器（开始按钮） */
.main-content {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 1.2s ease, transform 1.2s ease;
}

/* 玻璃弹窗通用样式 */
.glass-card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 22px;
    padding: 35px 55px;
    text-align: center;
}

/* 渐变文字 */
.gradient-text {
    font-size: 32px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff9966, #ff5e62, #833ab4, #fd1d1d, #fcb045);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: textGradient 4s ease infinite;
    cursor: pointer;
    transition: transform 0.2s ease;
}

/* 点击文字稍微缩放效果 */
.gradient-text:active {
    transform: scale(0.95);
}

/* 渐变文字动画 */
@keyframes textGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 加载完成后隐藏加载动画 */
.started .loader {
    opacity: 0;
    pointer-events: none;
}

/* 淡出动画类 */
body.fade-out {
    opacity: 0;
}

/* Home界面样式 - 默认隐藏 */
.home-content {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none; /* 初始隐藏 */
    justify-content: center;
    align-items: center;
    z-index: 99;
    opacity: 0;
    transition: opacity 1.2s ease;
}

/* 显示Home界面 */
.home-content.show {
    display: flex;
    opacity: 1;
}
</style>
</head>
<body>

<!-- 加载动画 -->
<div class="loader">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
</div>

<!-- 主页面：开始按钮 -->
<div class="main-content" id="startContent">
    <div class="glass-card">
        <div class="gradient-text" onclick="enterMain()">开始！</div>
    </div>
</div>

<!-- Home界面 - 初始隐藏 -->
<div class="home-content" id="homeContent">
    <div class="glass-card">
        <h1 style="color: white; margin-bottom: 20px;">欢迎进入Home界面</h1>
        <p style="color: white; margin-bottom: 30px;">这是通过点击“开始”按钮才会显示的内容</p>
        <div class="gradient-text" onclick="goBack()">返回</div>
    </div>
</div>

<script>
// 1. 模拟加载完成（保留原加载动画效果）
setTimeout(() => {
    document.body.classList.add('started');
}, 2200);

// 2. 点击开始 → 切换到Home界面（不跳转页面）
function enterMain() {
    // 执行淡出动画
    document.body.classList.add('fade-out');
    
    // 等待动画完成后切换内容
    setTimeout(() => {
        // 隐藏开始界面，显示Home界面
        document.getElementById('startContent').style.display = 'none';
        document.getElementById('homeContent').classList.add('show');
        // 重置body透明度
        document.body.classList.remove('fade-out');
    }, 800); // 时间匹配CSS动画时长
}

// 3. 返回开始界面（可选）
function goBack() {
    document.body.classList.add('fade-out');
    setTimeout(() => {
        document.getElementById('homeContent').classList.remove('show');
        document.getElementById('startContent').style.display = 'flex';
        document.body.classList.remove('fade-out');
    }, 800);
}
</script>

</body>
</html>
