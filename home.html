<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主页 / 热门 / 关于作者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background: linear-gradient(135deg, #3a7bd5, #00d2ff, #7b4397, #dc2430);
    background-size: 400% 400%;
    animation: bgGradient 12s ease infinite;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;
    overflow-x: hidden;
}

@keyframes bgGradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* 顶部导航玻璃 */
.navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 0 0 22px 22px;
    padding: 18px 30px;
    display: flex;
    justify-content: center;
    gap: 40px;
    z-index: 99;
    animation: navIn 0.8s ease-out;
}

@keyframes navIn {
    from { transform: translateY(-30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.nav-item {
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    opacity: 0.85;
    cursor: pointer;
    transition: all 0.3s ease;
}

.nav-item:hover { opacity: 1; transform: scale(1.08); }
.nav-item.active { opacity: 1; border-bottom: 2px solid #fff; }

/* 内容区 */
.content {
    margin-top: 120px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
}

.page-content {
    width: 100%;
    max-width: 900px;
    display: none;
    animation: fadeIn 1s ease;
}
.page-content.active { display: block; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.page-title {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 25px;
}

/* 卡片 */
.cards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
}

.card {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 22px;
    width: 100%;
    max-width: 280px;
    padding: 25px;
    text-align: center;
    transition: all 0.4s ease;
    animation: cardIn 0.8s ease backwards;
}
.card:nth-child(1) { animation-delay: 0.1s; }
.card:nth-child(2) { animation-delay: 0.2s; }
.card:nth-child(3) { animation-delay: 0.3s; }

@keyframes cardIn {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.card:hover {
    transform: translateY(-6px);
    background: rgba(255, 255, 255, 0.2);
}

/* 玻璃框 */
.glass-box {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 22px;
    padding: 30px;
    margin: 20px auto;
    max-width: 420px;
    text-align: center;
}

/* 表单 */
input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 16px;
    outline: none;
}
input::placeholder { color: rgba(255,255,255,0.6); }

.btn {
    padding: 12px 30px;
    margin: 8px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(90deg,#fff,#fff);
    color: #000;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}
.btn:hover { transform: scale(1.05); }
.btn:active { transform: scale(0.97); }

/* 验证码 */
.captcha-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,0,0,0.2);
    padding: 10px 15px;
    border-radius: 12px;
    margin: 10px 0;
}
.captcha-text {
    font-size: 20px;
    font-weight: bold;
    color: #fff;
}
.refresh-btn {
    background: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* 头像 */
.avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #fff, #eee);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: #333;
    cursor: pointer;
    transition: transform 0.3s ease;
    border: 3px solid rgba(255,255,255,0.3);
}
.avatar:hover { transform: scale(1.05); }

/* 手机自适应 */
@media (max-width: 768px) {
    .navbar { gap: 25px; }
    .nav-item { font-size: 16px; }
    .page-title { font-size: 22px; }
    .card { max-width: 90%; }
}

/* 下雪动画 */
.snow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
}
</style>
</head>
<body>

<!-- 下雪动画 -->
<canvas id="snow" class="snow"></canvas>

<!-- 导航 -->
<div class="navbar">
    <div class="nav-item active" onclick="switchPage('home')">主页</div>
    <div class="nav-item" onclick="switchPage('hot')">热门</div>
    <div class="nav-item" id="nav-feature" onclick="switchPage('feature')" style="display:none;">功能</div>
    <div class="nav-item" onclick="switchPage('about')">关于作者</div>
</div>

<!-- 内容区 -->
<div class="content">

    <!-- 主页 -->
    <div id="page-home" class="page-content active">
        <div class="page-title">欢迎进入主页</div>
        
        <div class="glass-box" style="margin-bottom:30px;">
            <div id="avatar" class="avatar" onclick="changeAvatar()">👤</div>
            <h3 id="welcome-text">欢迎来到我的网站</h3>
            <p>请登录后体验更多功能</p>
        </div>

        <div class="cards">
            <div class="card" id="feature-card" style="display:none;">
                <h3>功能入口</h3>
                <p>点击进入功能页面</p>
                <button class="btn" style="margin-top:10px;" onclick="goToFeature()">进入</button>
            </div>
            <div class="card">
                <h3>关于我</h3>
                <p>这里是你的个人介绍区域。</p>
                <p>你可以在这里写：你的名字、爱好、简介等。</p>
            </div>
            <div class="card">
                <h3>欢迎使用</h3>
                <p>这是一个玻璃风格现代化网页。</p>
            </div>
        </div>
    </div>

    <!-- 热门 -->
    <div id="page-hot" class="page-content">
        <div class="page-title">热门内容</div>
        <div class="cards">
            <div class="card" onclick="showMaking()">
                <h3>热门 1</h3>
                <p>点击查看热门内容</p>
            </div>
            <div class="card" onclick="goToMusic()">
                <h3>热门 2</h3>
                <p>免费音乐播放平台</p>
            </div>
        </div>
    </div>

    <!-- 功能 -->
    <div id="page-feature" class="page-content">
        <div class="page-title">功能页面</div>
        <div class="cards">
            <div class="card">
                <h3>功能 1</h3>
                <p>功能描述</p>
            </div>
            <div class="card">
                <h3>功能 2</h3>
                <p>功能描述</p>
            </div>
            <div class="card">
                <h3>功能 3</h3>
                <p>功能描述</p>
            </div>
        </div>
    </div>

    <!-- 关于作者 -->
    <div id="page-about" class="page-content">
        <div class="page-title">关于作者</div>
        <div class="glass-box">
            <h3>作者信息</h3>
            <p style="margin-top:10px;">QQ群：1065279470</p>
            <p>有感兴趣的进群了解</p>
            <p>所有数据保存在本地，不泄露</p>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div id="login-modal" class="glass-box" style="display:none;">
        <h3>账号登录</h3>
        <input id="login-user" placeholder="账号">
        <input id="login-pwd" type="password" placeholder="密码">
        
        <div class="captcha-box">
            <div id="captcha-text" class="captcha-text"></div>
            <button class="refresh-btn" onclick="refreshCaptcha()">刷新</button>
        </div>
        <input id="captcha-input" placeholder="请输入验证码">

        <button class="btn" onclick="login()">登录</button>
        <button class="btn" onclick="showRegister()">注册</button>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="glass-box" style="display:none;">
        <h3>注册账号</h3>
        <input id="reg-user" placeholder="账号">
        <input id="reg-pwd" type="password" placeholder="密码">
        <input id="reg-pwd2" type="password" placeholder="确认密码">
        
        <div class="captcha-box">
            <div id="reg-captcha-text" class="captcha-text"></div>
            <button class="refresh-btn" onclick="refreshRegCaptcha()">刷新</button>
        </div>
        <input id="reg-captcha-input" placeholder="请输入验证码">

        <button class="btn" onclick="register()">完成注册</button>
        <button class="btn" onclick="hideRegister()">返回登录</button>
    </div>

</div>

<script>
// 页面切换
function switchPage(page) {
    document.querySelectorAll('.page-content').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));

    if(page==='home') document.getElementById('page-home').classList.add('active');
    else if(page==='hot') document.getElementById('page-hot').classList.add('active');
    else if(page==='feature') document.getElementById('page-feature').classList.add('active');
    else if(page==='about') document.getElementById('page-about').classList.add('active');

    document.querySelectorAll('.nav-item')[
        page==='home'?0:
        page==='hot'?1:
        page==='feature'?2:3
    ].classList.add('active');
}

// ========= 登录/注册 =========
let captchaVal = 0;
let regCaptchaVal = 0;

// 刷新验证码
function refreshCaptcha() {
    captchaVal = Math.floor(Math.random()*9000)+1000;
    document.getElementById('captcha-text').innerText = captchaVal;
}
function refreshRegCaptcha() {
    regCaptchaVal = Math.floor(Math.random()*9000)+1000;
    document.getElementById('reg-captcha-text').innerText = regCaptchaVal;
}

// 显示注册
function showRegister() {
    document.getElementById('login-modal').style.display = 'none';
    document.getElementById('register-modal').style.display = 'block';
    refreshRegCaptcha();
}
function hideRegister() {
    document.getElementById('register-modal').style.display = 'none';
    document.getElementById('login-modal').style.display = 'block';
}

// 登录
function login() {
    let user = document.getElementById('login-user').value.trim();
    let pwd = document.getElementById('login-pwd').value.trim();
    let cap = document.getElementById('captcha-input').value.trim();

    if(!user || !pwd){ alert("请填写账号密码！"); return; }
    if(cap != captchaVal){ alert("验证码错误！"); return; }

    let local = JSON.parse(localStorage.getItem("users")) || [];
    let find = local.find(u=>u.user===user && u.pwd===pwd);
    if(!find){ alert("账号或密码错误！"); return; }
